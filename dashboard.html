<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindCare AI Dashboard</title>


<!-- Bootstrap -->
<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- Icons -->
<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
rel="stylesheet">


<!-- Custom CSS -->
<link 
rel="stylesheet"
href="/static/style.css">


<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>


<body>


<div class="container py-4">


<!-- HEADER -->

<div class="text-center mb-4">

<h1>
🧠 MindCare AI
</h1>

<p class="text-muted">
Intelligent Mental Health Dashboard
</p>

</div>




<!-- STATISTICS CARDS -->

<div class="row g-3">


<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fa-solid fa-calendar-check fa-2x"></i>

<h5>Total Check-ins</h5>

<h2 id="total">
0
</h2>

</div>

</div>

</div>



<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fa-solid fa-face-smile fa-2x"></i>

<h5>Happy Days</h5>

<h2 id="happy">
0
</h2>

</div>

</div>

</div>




<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fa-solid fa-heart fa-2x"></i>

<h5>Calm Days</h5>

<h2 id="calm">
0
</h2>

</div>

</div>

</div>




<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fa-solid fa-fire fa-2x"></i>

<h5>Current Streak</h5>

<h2 id="streak">
0
</h2>

</div>

</div>

</div>



</div>





<!-- GRAPHICS -->

<div class="row mt-4">


<div class="col-md-6">


<div class="card p-3">


<h4>
📈 Weekly Mood
</h4>


<canvas id="weeklyChart"></canvas>


</div>


</div>





<div class="col-md-6">


<div class="card p-3">


<h4>
📊 Mood Statistics
</h4>


<canvas id="moodChart"></canvas>


</div>


</div>



</div>






<!-- DAILY CHECK IN -->


<div class="card mt-4 p-4">


<h3>
😊 Daily Check-in
</h3>


<p>
How are you feeling today?
</p>



<textarea

id="checkinText"

class="form-control"

rows="3"

placeholder="Write how you feel today..."

></textarea>



<button

class="btn btn-primary mt-3"

onclick="sendCheckin()"

>

Save Mood

</button>



<div 
id="checkinResult"
class="mt-3">

</div>



</div>








<!-- AI CHAT -->


<div class="card mt-4 p-4">


<h3>
🤖 MindCare AI Assistant
</h3>



<div

id="chatBox"

class="chat-box">

</div>




<div class="input-group mt-3">


<input

id="chatInput"

class="form-control"

placeholder="Write your message..."

>



<button

class="btn btn-success"

onclick="sendMessage()"

>

Send

</button>


</div>



</div>





</div>





<script src="/static/script.js"></script>


</body>


</html>
